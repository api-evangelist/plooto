actions:
  openapiHarvested: false
  specsSaved: 0
  reason: >-
    No first-party public developer portal, API reference, or downloadable
    OpenAPI/Swagger specification exists. Backend gateway is live but
    undocumented and gated. Captured as built-stub (identity only).
